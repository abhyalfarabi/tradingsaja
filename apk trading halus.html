<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNAL TRADING FOREX</title>
<style>
:root{--gold:#c9a34a;--gold2:#f0d58b;--ink:#202637;--muted:#6d7483;--line:#e8eaf0;--bg:#f6f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:700;transition:transform .25s,filter .25s,box-shadow .25s}button:hover{transform:translateY(-2px);filter:brightness(1.03)}.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#282313;box-shadow:0 8px 22px #c9a34a30}.ghost{background:#f2f3f6;color:var(--ink)}.danger{background:#fff0f0;color:#b32635}.small{padding:7px 10px;font-size:12px}
.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 25px}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#f7e7ae,#b78c2e);display:grid;place-items:center;color:#3d3012;font-weight:900}.brand strong{font-size:14px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.navlabel{font-size:10px;color:#9ba1ae;letter-spacing:.16em;padding:14px 12px 8px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#626a79;text-align:left;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px}.nav button.active,.nav button:hover{background:#fbf5e6;color:#7b5b15}.nav .ico{width:20px;text-align:center}.sidefoot{position:absolute;bottom:22px;left:20px;right:20px;padding:14px;background:#faf7ee;border-radius:16px;font-size:12px;color:#79622d}
main{min-width:0;padding:26px clamp(16px,3vw,38px) 50px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#a17b27;font-weight:800;text-transform:uppercase}.topbar h1{font-size:clamp(23px,3vw,31px);margin:5px 0 0;letter-spacing:-.04em}.userchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:14px;font-size:13px}.avatar{width:34px;height:34px;border-radius:11px;background:#202637;color:white;display:grid;place-items:center;font-weight:800}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 28px #22263805;min-width:0;animation:morphIn .42s ease both}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:80px;height:80px;right:-24px;top:-25px;border-radius:50%;background:var(--bubble,#f7edce);opacity:.7}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:26px;font-weight:850;letter-spacing:-.04em;margin:12px 0 6px}.stat .hint{font-size:11px;color:#8a91a0}.gold{--bubble:#f7e7b7}.blue{--bubble:#dbeafe}.mint{--bubble:#d9f5e8}.rose{--bubble:#ffe1e4}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0;letter-spacing:-.02em}.sectionhead p{font-size:12px;color:var(--muted);margin:5px 0 0}.two{grid-template-columns:minmax(0,1.45fr) minmax(260px,.85fr)}.signal{border:1px solid #f0e3be;background:linear-gradient(135deg,#fffdf7,#fff);border-radius:18px;padding:18px;margin-bottom:12px}.signalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.pair{font-weight:900;font-size:17px;letter-spacing:.01em}.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;padding:6px 9px;border-radius:99px;background:#e8f8ef;color:#18794e}.pill.wait{background:#fff3d6;color:#8b6413}.pill.sell{background:#ffebec;color:#b32635}.signalmeta{color:var(--muted);font-size:12px;margin-top:7px}.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}.level{background:#f7f8fa;border-radius:12px;padding:10px 8px}.level small{display:block;color:#858b98;font-size:10px}.level b{font-size:13px;display:block;margin-top:5px;overflow-wrap:anywhere}.signalfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;font-size:11px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick button{padding:15px;text-align:left;background:#f8f8fa;border:1px solid var(--line);color:var(--ink)}.quick button span{display:block;font-size:20px;margin-bottom:8px}.quick button small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.profileline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0f1f4;font-size:13px}.profileline:last-child{border:0}.profileline span{color:var(--muted)}.view{display:none}.view.active{display:block;animation:morphIn .4s cubic-bezier(.2,.8,.2,1) both}@keyframes morphIn{from{opacity:0;transform:translateY(10px) scale(.99);border-radius:28px}to{opacity:1;transform:translateY(0) scale(1);border-radius:20px}}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#626a79;font-weight:700}.field input,.field select{border:1px solid #dfe2e9;background:#fff;border-radius:11px;padding:12px;outline:none;width:100%}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9a34a20}.span2{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf0f4;font-size:12px}th{color:#828999;font-size:10px;text-transform:uppercase;letter-spacing:.08em}td{color:#343b4b}.notice{padding:13px 15px;border-radius:13px;background:#fff8e6;color:#785d1c;font-size:12px;line-height:1.6;margin-bottom:16px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#fbf1cf,transparent 42%),#f6f7fa}.auth{width:min(460px,100%);padding:30px;border-radius:25px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 70px #20263712;animation:morphIn .5s ease}.auth h1{font-size:27px;letter-spacing:-.04em;margin:14px 0 7px}.auth p{color:var(--muted);font-size:13px;line-height:1.6}.authswitch{display:flex;justify-content:center;gap:5px;align-items:center;margin-top:18px;font-size:12px;color:var(--muted)}.authswitch button{padding:5px 7px;background:transparent;color:#8a681b;text-decoration:underline}.footnote{color:#969ba7;font-size:11px;line-height:1.6;margin-top:18px}.mobilemenu{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.sidefoot{display:none}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:sticky;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:3px 4px 10px}.brandmark{width:36px;height:36px}.navlabel{display:none}.nav{flex-direction:row;overflow:auto;padding-bottom:2px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav .ico{display:none}main{padding:19px 14px 35px}.topbar{margin-bottom:20px}.userchip .usertext{display:none}.stats{gap:10px}.card{padding:16px;border-radius:17px}.stat .value{font-size:22px}.levels{gap:5px}.level{padding:9px 5px}.level b{font-size:11px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.sectionhead{align-items:flex-start}.topbar h1{font-size:24px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='stf_data_v1';
const seed={users:[],signals:[],balance:{},topups:[]};
let db=loadDB(),session=null,view='dashboard',authMode='login';
function loadDB(){try{return {...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0)}
function me(){return db.users.find(u=>u.id===session?.id)}
function isAdmin(){return session?.role==='admin'}
function init(){if(session){renderApp()}else renderAuth()}
function renderAuth(){document.getElementById('app').innerHTML=`<div class="authwrap"><div class="auth"><div class="brand"><div class="brandmark">✦</div><div><strong>SIGNAL TRADING FOREX</strong><small>Gold signal workspace</small></div></div><div class="eyebrow">TRADING DASHBOARD</div><h1>${authMode==='login'?'Selamat datang kembali':'Buat akun trader'}</h1><p>Akses informasi signal GOLD/XAU, saldo utama, dan profil trader dalam satu dashboard.</p><div class="eyebrow" style="margin-top:22px">${authMode==='login'?'HALAMAN LOGIN':'HALAMAN PENDAFTARAN'}</div><form onsubmit="authSubmit(event)"><div class="formgrid">${authMode==='register'?`<div class="field span2"><label>Nama lengkap</label><input name="name" placeholder="Nama Anda" required></div><div class="field span2"><label>Nomor HP</label><input name="phone" placeholder="08xxxxxxxxxx" required></div>`:''}<div class="field span2"><label>${authMode==='login'?'User':'Username'}</label><input name="username" required autocomplete="username" placeholder="${authMode==='login'?'Masukkan user':'Buat username'}"></div><div class="field span2"><label>Sandi</label><input name="password" type="password" required autocomplete="${authMode==='login'?'current-password':'new-password'}" placeholder="Masukkan sandi"></div>${authMode==='register'?`<div class="field span2"><label>Pengalaman trading</label><select name="experience"><option>Pemula</option><option>1–3 tahun</option><option>3–5 tahun</option><option>Lebih dari 5 tahun</option></select></div><div class="field span2"><label>Keinginan / tujuan trading</label><input name="goal" placeholder="Contoh: belajar disiplin risiko"></div>`:''}</div><div class="actions"><button class="primary" style="width:100%" type="submit">${authMode==='login'?'Masuk ke dashboard':'Daftar akun'}</button></div></form><div class="authswitch">${authMode==='login'?'Belum punya akun?':'Sudah punya akun?'} <button type="button" onclick="setAuth('${authMode==='login'?'register':'login'}')">${authMode==='login'?'Daftar akun':'Masuk ke akun'}</button></div><div class="footnote">Data saat ini tersimpan di browser ini. Untuk penggunaan nyata, hubungkan aplikasi ke server aman dan gunakan sandi yang kuat.</div></div></div>`}
function setAuth(m){authMode=m;renderAuth()}
function isWeekend(){const d=new Date().getDay();return d===0||d===6}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function chargeDaily(u){const day=todayKey();if(u.lastChargeDate!==day){db.balance[u.id]=Math.max(0,(db.balance[u.id]??100000)-5000);u.lastChargeDate=day;save()}}
function authSubmit(e){e.preventDefault();if(isWeekend())return alert('Aplikasi tutup setiap hari Sabtu dan Minggu. Silakan login kembali pada hari kerja.');const f=new FormData(e.target),username=String(f.get('username')).trim(),password=String(f.get('password'));if(username.toLowerCase()==='admin'&&password==='123'){session={id:'admin',role:'admin',name:'Konsultan'};view='dashboard';init();return}
if(authMode==='register'){if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return alert('Username sudah terdaftar.');const u={id:Date.now().toString(),name:String(f.get('name')).trim(),phone:String(f.get('phone')).trim(),username,password,experience:f.get('experience'),goal:String(f.get('goal')||''),role:'trader',created:new Date().toISOString()};db.users.push(u);db.balance[u.id]=100000;chargeDaily(u);save();session={id:u.id,role:'trader',name:u.name};view='dashboard';init()}else{const u=db.users.find(u=>u.username.toLowerCase()===username.toLowerCase()&&u.password===password);if(!u)return alert('Akun tidak ditemukan atau sandi salah.');chargeDaily(u);session={id:u.id,role:u.role,name:u.name};view='dashboard';init()}}
function navItems(){return isAdmin()?[['dashboard','⌂','Dashboard'],['signals','✦','Kelola Signal'],['users','♙','Data Trader'],['topups','＄','Top Up'],['partners','◇','Mitra'],['settings','⚙','Pengaturan']]:[['dashboard','⌂','Menu Utama'],['signals','✦','Signal GOLD'],['balance','＄','Saldo & Top Up'],['profile','♙','Profil Saya'],['partners','◇','Mitra']]}
function renderApp(){const u=me()||{};const bal=isAdmin()?db.topups.filter(t=>t.status==='Menunggu').length:(db.balance[u.id]||0);document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">✦</div><div><strong>SIGNAL TRADING FOREX</strong><small>Gold intelligence terminal</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav">${navItems().map(([id,ico,label])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('')}<button onclick="logout()"><span class="ico">↪</span>Keluar</button></nav><div class="sidefoot"><b>GOLD / XAU</b><br><span>Fokus tunggal · GOLD / XAU</span></div></aside><main><header class="topbar"><div><div class="eyebrow">${isAdmin()?'CONSULTANT CONTROL':'PERSONAL TRADING SPACE'}</div><h1>${titleFor(view)}</h1></div><div class="userchip"><div class="avatar">${esc((isAdmin()?'A':u.name||'T').slice(0,1).toUpperCase())}</div><div class="usertext"><b>${esc(isAdmin()?'Konsultan':u.name||'Trader')}</b><div style="color:#858b98;font-size:11px">${isAdmin()?'Admin':esc(u.phone||'Trader')}</div></div></div></header><div id="content">${renderView()}</div></main></div>`}
function titleFor(v){return ({dashboard:'Dashboard',signals:'Signal Trading GOLD',balance:'Saldo & Top Up',profile:'Profil Trader',partners:'Informasi Mitra',users:'Data Trader',topups:'Permintaan Top Up',settings:'Pengaturan Aplikasi'})[v]||'Dashboard'}
function go(v){view=v;renderApp()}
function renderView(){if(view==='dashboard')return dashboard();if(view==='signals')return signalsPage();if(view==='balance')return balancePage();if(view==='profile')return profilePage();if(view==='partners')return partnersPage();if(view==='users')return usersPage();if(view==='topups')return topupsPage();if(view==='settings'&&isAdmin())return settingsPage();return dashboard()}
function dashboard(){const u=me()||{}, signals=db.signals;return `<div class="grid stats"><div class="card stat gold"><div class="label">Saldo utama</div><div class="value">${money(isAdmin()?0:(db.balance[u.id]||0))}</div><div class="hint">${isAdmin()?'Ringkasan saldo pengguna tersedia pada data trader':'Saldo akun Anda'}</div></div><div class="card stat blue"><div class="label">Signal GOLD</div><div class="value">${signals.length}</div><div class="hint">Signal yang tercatat</div></div><div class="card stat mint"><div class="label">${isAdmin()?'Total trader':'Pengalaman trading'}</div><div class="value">${isAdmin()?db.users.length:esc(u.experience||'—')}</div><div class="hint">${isAdmin()?'Akun terdaftar':'Informasi profil Anda'}</div></div><div class="card stat rose"><div class="label">Status workspace</div><div class="value" style="font-size:20px">SIAP</div><div class="hint">Perlu backend & feed harga live</div></div></div><div class="grid two"><section class="card"><div class="sectionhead"><div><h2>Signal terbaru</h2><p>Instrumen tunggal: GOLD / XAU</p></div><button class="ghost small" onclick="go('signals')">Lihat semua ↗</button></div>${signals.slice(0,2).map(signalCard).join('')||'<p>Belum ada signal.</p>'}</section><section class="card"><div class="sectionhead"><div><h2>${isAdmin()?'Ringkasan konsultan':'Akses cepat'}</h2><p>${isAdmin()?'Pantau data aplikasi':'Navigasi fitur utama'}</p></div></div>${isAdmin()?`<div class="profileline"><span>Trader terdaftar</span><b>${db.users.length}</b></div><div class="profileline"><span>Permintaan top up menunggu</span><b>${db.topups.filter(t=>t.status==='Menunggu').length}</b></div><div class="profileline"><span>Total signal</span><b>${db.signals.length}</b></div>`:`<div class="quick"><button onclick="go('signals')"><span>✦</span>Signal GOLD<small>Entry, SL, TP1–TP5</small></button><button onclick="go('balance')"><span>＄</span>Top up saldo<small>Ajukan penambahan saldo</small></button><button onclick="go('profile')"><span>♙</span>Profil trader<small>Data dan tujuan Anda</small></button><button onclick="go('partners')"><span>◇</span>Area mitra<small>Informasi signal</small></button></div>`}</section></div><div class="notice" style="margin-top:16px"><b>Penting:</b> Signal ditambahkan oleh konsultan. Aplikasi ini belum menerima harga live dan tidak menghasilkan rekomendasi transaksi otomatis. Pastikan entry, stop loss, dan target diisi berdasarkan data yang sudah diverifikasi.</div>`}
function signalCard(s){return `<div class="signal"><div class="signalhead"><div><div class="pair">GOLD / XAU <span style="color:#9a7a32;font-size:11px">#${s.id}</span></div><div class="signalmeta">Dibuat ${new Date(s.created).toLocaleString('id-ID')}</div></div><span class="pill ${s.direction==='SELL'?'sell':s.status==='MENUNGGU INPUT'?'wait':''}">${esc(s.direction)} · ${esc(s.status)}</span></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px"><div class="level"><small>ENTRY</small><b>${esc(s.entry)}</b></div><div class="level"><small>STOP LOSS</small><b>${esc(s.sl)}</b></div></div><div class="levels">${s.tp.map((v,i)=>`<div class="level"><small>TP${i+1}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="signalfoot"><span>${esc(s.note||'Signal GOLD/XAU')}</span>${isAdmin()?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost small" onclick="editSignal(${s.id})">Edit</button><button class="primary small" onclick="confirmTP(${s.id})">Konfirmasi TP ke Mitra</button><button class="danger small" onclick="deleteSignal(${s.id})">Hapus</button></div>`:''}</div></div>`}
function signalsPage(){return `${isAdmin()?`<section class="card" style="margin-bottom:16px"><div class="sectionhead"><div><h2>Publikasikan signal</h2><p>Gunakan data harga dan level yang sudah Anda verifikasi.</p></div></div><form onsubmit="addSignal(event)"><div class="formgrid"><div class="field"><label>Arah</label><select name="direction"><option>BUY</option><option>SELL</option><option>WAIT</option></select></div><div class="field"><label>Status</label><select name="status"><option>AKTIF</option><option>MENUNGGU INPUT</option><option>SELESAI</option><option>BATAL</option></select></div><div class="field"><label>Entry</label><input name="entry" placeholder="Contoh: 2750.00" required></div><div class="field"><label>Stop Loss</label><input name="sl" placeholder="Contoh: 2738.00" required></div>${[1,2,3,4,5].map(n=>`<div class="field"><label>Take Profit ${n}</label><input name="tp${n}" placeholder="Harga TP${n}" required></div>`).join('')}<div class="field span2"><label>Catatan</label><input name="note" placeholder="Catatan signal / manajemen risiko"></div></div><div class="actions"><button class="primary">Terbitkan signal</button></div></form></section>`:''}<section class="card"><div class="sectionhead"><div><h2>Daftar signal</h2><p>Hanya instrumen GOLD / XAU.</p></div></div>${db.signals.slice().reverse().map(signalCard).join('')||'<p>Belum ada signal.</p>'}</section>`}
function addSignal(e){e.preventDefault();const f=new FormData(e.target),s={id:Date.now(),pair:'GOLD / XAU',direction:f.get('direction'),status:f.get('status'),entry:f.get('entry'),sl:f.get('sl'),tp:[1,2,3,4,5].map(n=>f.get('tp'+n)),note:f.get('note'),created:new Date().toISOString()};db.signals.push(s);save();renderApp();alert('Signal tersimpan. Untuk mengirim notifikasi WhatsApp, gunakan tombol konfirmasi/tautan WhatsApp; pengiriman otomatis massal memerlukan backend WhatsApp Business API.')}
function deleteSignal(id){if(!isAdmin()||!confirm('Hapus signal ini?'))return;db.signals=db.signals.filter(s=>s.id!==id);save();renderApp()}
function confirmTP(id){const s=db.signals.find(x=>x.id===id);if(!s)return;const msg=`Konfirmasi signal GOLD/XAU\nArah: ${s.direction}\nEntry: ${s.entry}\nSL: ${s.sl}\nTP1: ${s.tp[0]} | TP2: ${s.tp[1]} | TP3: ${s.tp[2]} | TP4: ${s.tp[3]} | TP5: ${s.tp[4]}`;const list=db.users.filter(u=>u.phone);if(!list.length)return alert('Belum ada nomor WhatsApp mitra.');if(list.length>1){const chosen=prompt('Masukkan nomor HP mitra yang akan dikirimi (contoh 62812xxxx):\n'+list.map(u=>`${u.name}: ${u.phone}`).join('\n'));if(!chosen)return;window.open('https://wa.me/'+chosen.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank','noopener')}else{window.open('https://wa.me/'+list[0].phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank','noopener')}}
function editSignal(id){const s=db.signals.find(s=>s.id===id);if(!s)return;const entry=prompt('Ubah harga Entry:',s.entry);if(entry===null)return;const sl=prompt('Ubah Stop Loss:',s.sl);if(sl===null)return;s.entry=entry;s.sl=sl;for(let i=0;i<5;i++){const x=prompt('Ubah TP'+(i+1)+':',s.tp[i]);if(x!==null)s.tp[i]=x}save();renderApp()}
function balancePage(){const u=me()||{},bal=db.balance[u.id]||0;return `<div class="grid two"><section class="card"><div class="eyebrow">WALLET</div><h2 style="font-size:30px;margin:12px 0">${money(bal)}</h2><p style="font-size:13px;color:var(--muted)">Saldo utama akun Anda. Status saldo dan transaksi perlu dikonfirmasi melalui sistem pembayaran yang terhubung.</p><form onsubmit="requestTopup(event)" style="margin-top:20px"><div class="field"><label>Nominal top up (IDR)</label><input type="number" name="amount" min="10000" step="1000" required placeholder="Minimal Rp10.000"></div><div class="field" style="margin-top:13px"><label>Catatan / metode pembayaran</label><input name="note" placeholder="Nama pengirim / bank / referensi"></div><div class="field" style="margin-top:13px"><label>Bukti transfer (JPG/PNG/PDF)</label><input name="proof" type="file" accept="image/*,.pdf" required></div><div class="notice" style="margin-top:12px">Pembayaran Midtrans belum diaktifkan. Jangan masukkan kunci server pembayaran ke halaman HTML publik.</div><div class="actions"><button class="primary">Ajukan top up</button></div></form></section><section class="card"><div class="sectionhead"><div><h2>Riwayat permintaan</h2><p>Status dapat dipantau konsultan</p></div></div>${db.topups.filter(t=>t.userId===u.id).slice().reverse().map(t=>`<div class="profileline"><div><b>${money(t.amount)}</b><div style="font-size:11px;color:#858b98">${new Date(t.created).toLocaleString('id-ID')}</div></div><span>${esc(t.status)}</span></div>`).join('')||'<p style="font-size:13px;color:var(--muted)">Belum ada permintaan top up.</p>'}</section></div>`}
function requestTopup(e){e.preventDefault();const f=new FormData(e.target),u=me(),file=f.get('proof');if(!file||!file.size)return alert('Unggah bukti transfer terlebih dahulu.');if(file.size>1500000)return alert('Ukuran bukti maksimal 1,5 MB untuk penyimpanan browser.');const reader=new FileReader();reader.onload=()=>{db.topups.push({id:Date.now(),userId:u.id,amount:Number(f.get('amount')),note:f.get('note'),proofName:file.name,proofData:reader.result,status:'Menunggu',created:new Date().toISOString()});try{save();renderApp();alert('Permintaan top up dan bukti transfer dicatat pada browser ini.')}catch(err){alert('Penyimpanan penuh. Gunakan backend untuk menyimpan bukti transfer.')}};reader.readAsDataURL(file)}
function profilePage(){const u=me()||{};return `<section class="card"><div class="sectionhead"><div><h2>Profil trader</h2><p>Informasi profil akun Anda</p></div></div><form onsubmit="saveProfile(event)"><div class="formgrid"><div class="field"><label>Nama lengkap</label><input name="name" required value="${esc(u.name)}"></div><div class="field"><label>Nomor HP</label><input name="phone" required value="${esc(u.phone)}"></div><div class="field"><label>Pengalaman trading</label><select name="experience">${['Pemula','1–3 tahun','3–5 tahun','Lebih dari 5 tahun'].map(x=>`<option ${u.experience===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Keinginan / tujuan trading</label><input name="goal" value="${esc(u.goal||'')}"></div><div class="field span2"><label>Username</label><input value="${esc(u.username)}" disabled></div></div><div class="actions"><button class="primary">Simpan profil</button></div></form></section>`}
function saveProfile(e){e.preventDefault();const f=new FormData(e.target),u=me();u.name=f.get('name');u.phone=f.get('phone');u.experience=f.get('experience');u.goal=f.get('goal');session.name=u.name;save();renderApp();alert('Profil tersimpan.')}
function partnersPage(){return `<div class="grid two"><section class="card"><div class="eyebrow">MITRA</div><h2>Informasi signal untuk mitra</h2><p style="font-size:13px;line-height:1.7;color:var(--muted)">Mitra dapat melihat informasi signal GOLD/XAU yang diterbitkan konsultan. Gunakan data ini sebagai informasi, bukan jaminan hasil transaksi.</p><div class="profileline"><span>Instrumen</span><b>GOLD / XAU</b></div><div class="profileline"><span>Level target</span><b>TP1 · TP2 · TP3 · TP4 · TP5</b></div></section><section class="card"><div class="sectionhead"><div><h2>Signal terbaru</h2><p>Informasi yang diterbitkan konsultan</p></div></div>${db.signals.slice().reverse().map(signalCard).join('')||'Belum ada signal.'}</section></div>`}
function usersPage(){return `<section class="card"><div class="sectionhead"><div><h2>Data trader</h2><p>Informasi akun yang tersimpan di browser ini</p></div><button class="ghost small" onclick="exportData()">Ekspor JSON</button></div><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Nomor HP</th><th>Username</th><th>Pengalaman</th><th>Tujuan trading</th><th>Saldo utama</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.phone)}</td><td>${esc(u.username)}</td><td>${esc(u.experience)}</td><td>${esc(u.goal||'—')}</td><td>${money(db.balance[u.id]||0)}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada trader terdaftar.</td></tr>'}</tbody></table></div><div class="notice" style="margin-top:14px">Akun dan data di halaman ini hanya contoh penyimpanan lokal. Untuk data konsultan lintas perangkat, dibutuhkan backend dengan autentikasi dan hak akses.</div></section>`}
function topupsPage(){return `<section class="card"><div class="sectionhead"><div><h2>Permintaan top up</h2><p>Kelola status dan saldo utama trader</p></div></div><div class="tablewrap"><table><thead><tr><th>Trader</th><th>Nominal</th><th>Catatan / Bukti</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${db.topups.slice().reverse().map(t=>{const u=db.users.find(u=>u.id===t.userId)||{};return `<tr><td>${esc(u.name||'Akun tidak ditemukan')}</td><td>${money(t.amount)}</td><td>${esc(t.note||'—')} ${t.proofData?`<br><a href="${t.proofData}" target="_blank" rel="noopener">Lihat bukti: ${esc(t.proofName||'lampiran')}</a>`:''}</td><td>${new Date(t.created).toLocaleString('id-ID')}</td><td>${esc(t.status)}</td><td>${t.status==='Menunggu'?`<button class="primary small" onclick="approveTopup(${t.id})">Setujui</button> <button class="danger small" onclick="rejectTopup(${t.id})">Tolak</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="6">Belum ada permintaan.</td></tr>'}</tbody></table></div></section>`}
function approveTopup(id){const t=db.topups.find(t=>t.id===id);if(!t)return;if(!confirm('Setujui dan tambahkan saldo ke akun?'))return;t.status='Disetujui';db.balance[t.userId]=(db.balance[t.userId]||0)+t.amount;save();renderApp()}
function rejectTopup(id){const t=db.topups.find(t=>t.id===id);if(t){t.status='Ditolak';save();renderApp()}}
function settingsPage(){return `<section class="card"><div class="sectionhead"><div><h2>Pengaturan Aplikasi</h2><p>Ringkasan aturan operasional</p></div></div><div class="profileline"><span>Instrumen</span><b>GOLD / XAU</b></div><div class="profileline"><span>Saldo awal mitra</span><b>Rp100.000</b></div><div class="profileline"><span>Biaya harian</span><b>Rp5.000 per hari kerja login</b></div><div class="profileline"><span>Hari operasional</span><b>Senin–Jumat</b></div><div class="notice" style="margin-top:14px">Pengaturan menu penuh, sinkronisasi antarperangkat, pembayaran otomatis, dan notifikasi WhatsApp massal memerlukan backend. Jangan menyimpan Server Key Midtrans di HTML/JavaScript publik.</div><button class="ghost" onclick="exportData()">Ekspor semua data JSON</button></section>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='signal-trading-forex-data.json';a.click();URL.revokeObjectURL(url)}
function logout(){session=null;view='dashboard';init()}
init();
</script>
</body></html>
